<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎂 3D 颗粒蛋糕</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(120% 120% at 50% 18%, #3a1a5e 0%, #20103f 46%, #0c0522 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* 顶部标题 */
  @font-face {
    font-family: "字小魂初林体";
    src: url("./ZiXiaoHunChuLinTi/ZiXiaoHunChuLinTi%28ShangYongXuShouQuan%29-2.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --title-font: "字小魂初林体", "楷体", "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding-top: 4.5vh;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    margin: 0;
    font-family: var(--title-font);
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    font-weight: normal;
    letter-spacing: 0.08em;
    color: #fff2fe;
    text-shadow: 0 0 22px rgba(255, 180, 120, 0.55), 0 0 60px rgba(255, 120, 200, 0.35);
    animation: titleFloat 4s ease-in-out infinite;
  }
  @keyframes titleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* 控制区 */
  .controls {
    position: fixed;
    bottom: 5vh;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    z-index: 10;
  }

  .btn {
    pointer-events: auto;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 0.85rem 2.2rem;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #4a1d0a;
    background: linear-gradient(120deg, #ffe29a, #ffd23f);
    box-shadow: 0 6px 30px rgba(255, 190, 60, 0.45), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 10px 38px rgba(255, 190, 60, 0.6), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .btn:active { transform: translateY(0) scale(0.98); }

  .hint {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.12em;
  }

  /* 吹蜡烛后的短暂提示 */
  .toast {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    font-size: 1.05rem;
    color: #ffe9b0;
    text-shadow: 0 0 16px rgba(255, 200, 90, 0.7);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* 加载失败提示（默认隐藏） */
  #loadError {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  #loadError .card {
    max-width: 30rem;
    padding: 1.6rem 2rem;
    border-radius: 16px;
    background: rgba(20, 10, 40, 0.85);
    border: 1px solid rgba(255, 160, 120, 0.3);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    color: #ffd9c0;
    line-height: 1.7;
  }
  #loadError code {
    background: rgba(255, 255, 255, 0.12);
    padding: 0.15em 0.5em;
    border-radius: 6px;
    color: #ffe9b0;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="overlay">
    <h1 class="title">19岁生日快乐!</h1>
  </div>

  <div class="controls">
    <button id="blowBtn" class="btn">吹蜡烛</button>
    <div id="toast" class="toast">生日快乐，心想事成~</div>
  </div>

  <div id="loadError">
    <div class="card">
      <strong>😢 3D 资源加载失败</strong><br />
      无法从 CDN 加载 Three.js，通常是网络不通导致的。<br /><br />
      请检查网络后刷新，或在当前目录启动本地服务器：<br />
      <code>python -m http.server 8000</code><br />
      然后访问 <code>http://localhost:8000</code>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================= 基础场景 ============================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0, 2.8, 8.5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.58;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.update();

/* 灯光 */
scene.add(new THREE.AmbientLight(0xffffff, 1.15));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(4, 7, 3);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffcfe0, 0.9);
rimLight.position.set(-4, 3, -4);
scene.add(rimLight);
const candleGlow = new THREE.PointLight(0xffb066, 1.4, 9, 2);
candleGlow.position.set(0, 3.0, 0);
scene.add(candleGlow);

/* ============================= 工具函数 ============================= */
// 生成一张带柔和边缘的圆形光斑贴图（配合 vertexColors 使用，贴图为白色）
function makeCircleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.85)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

// 生成蜡烛火焰的径向渐变贴图
function makeFlameTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 72, 0, 64, 64, 62);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,242,180,0.95)');
  g.addColorStop(0.5, 'rgba(255,168,58,0.8)');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
// HSL -> RGB（h 用 0~1 表示一圈），返回 0~1 的 sRGB 值
function hslToRgb(h, s, l) {
  const f = (n) => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0), f(8), f(4)];
}
// 按角度取彩虹色，形成环绕蛋糕的炫彩渐变
function rainbowColor(theta, s, l, hueOffset = 0) {
  let h = theta / (Math.PI * 2) + hueOffset;
  h -= Math.floor(h);
  return hslToRgb(h, s, l);
}

/* ============================= 蛋糕（颗粒） ============================= */
// 三层蛋糕，每层用“角度→彩虹色”上色，逐层微调色相/亮度，形成炫彩渐变
const LAYERS = [
  { cy: 0.50, radius: 2.0, height: 0.9, hueOffset: 0.00, lightness: 0.56 },
  { cy: 1.40, radius: 1.5, height: 0.8, hueOffset: 0.15, lightness: 0.62 },
  { cy: 2.15, radius: 1.3, height: 0.7, hueOffset: 0.30, lightness: 0.68 },
];
const TOP_Y = 2.50; // 最顶层上表面（= 顶层 cy + height/2），蜡烛从这里长出来

const cakePositions = [];
const cakeColors = [];

// 蛋糕身体：填满整层圆柱（内部 + 外壳 + 顶面 + 底面），形成实心颗粒
for (const layer of LAYERS) {
  const { cy, radius, height, hueOffset, lightness } = layer;
  const bottomY = cy - height / 2;
  const topY = cy + height / 2;

  // 1) 体积填充：均匀填满整个圆柱，内部稍暗、越靠边缘越亮，营造立体感
  const fillCount = Math.floor(7000 * (radius / 2.3) * (height / 0.9));
  for (let i = 0; i < fillCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = radius * Math.sqrt(Math.random());
    const y = bottomY + Math.random() * height;
    cakePositions.push(Math.cos(a) * r, y, Math.sin(a) * r);
    const l = lightness - 0.1 + (r / radius) * 0.1 + (Math.random() - 0.5) * 0.05;
    cakeColors.push(...rainbowColor(a, 0.5, l, hueOffset));
  }

  // 2) 外壳：外表面一圈更密更亮的颗粒，保证轮廓清晰
  const shellCount = Math.floor(2000 * (radius / 2.3));
  for (let i = 0; i < shellCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const y = bottomY + Math.random() * height;
    const r = radius + (Math.random() - 0.5) * 0.025;
    cakePositions.push(Math.cos(a) * r, y, Math.sin(a) * r);
    cakeColors.push(...rainbowColor(a, 0.5, lightness + (Math.random() - 0.5) * 0.08, hueOffset));
  }

  // 3) 顶面 / 底面：各覆盖一层密实颗粒，从上方和下方看都是实心
  const faceCount = Math.floor(1300 * (radius / 2.3));
  for (let i = 0; i < faceCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = radius * Math.sqrt(Math.random());
    cakePositions.push(Math.cos(a) * r, topY, Math.sin(a) * r);
    cakeColors.push(...rainbowColor(a, 0.5, lightness + (Math.random() - 0.5) * 0.08, hueOffset));
  }
  for (let i = 0; i < faceCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = radius * Math.sqrt(Math.random());
    cakePositions.push(Math.cos(a) * r, bottomY, Math.sin(a) * r);
    cakeColors.push(...rainbowColor(a, 0.5, lightness - 0.05 + (Math.random() - 0.5) * 0.06, hueOffset));
  }
}

const cakeGeometry = new THREE.BufferGeometry();
cakeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cakePositions, 3));
cakeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(cakeColors, 3));

const cakeMaterial = new THREE.PointsMaterial({
  size: 0.08,
  map: makeCircleTexture(),
  vertexColors: true,
  transparent: true,
  depthWrite: true,
  sizeAttenuation: true,
});
const cake = new THREE.Points(cakeGeometry, cakeMaterial);
scene.add(cake);

/* ============================= 糖霜 + 糖粒 ============================= */
const toppingPositions = [];
const toppingColors = [];

// 每层顶部一圈奶油糖霜（含向下滴落的奶滴）
for (const layer of LAYERS) {
  const { cy, radius, height } = layer;
  const topY = cy + height / 2;
  const count = Math.floor(650 * (radius / 2.3) + 220);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = radius + 0.02 + Math.random() * 0.055;
    const drip = Math.random();
    const y = topY - (drip > 0.55 ? (drip - 0.55) * 0.6 : 0);
    toppingPositions.push(Math.cos(a) * r, y, Math.sin(a) * r);
    const w = 0.95 + Math.random() * 0.05;
    toppingColors.push(w, w * 0.98, w * 0.94);
  }
}

// 彩色糖粒（funfetti 风格），散落在蛋糕表面
const SPRINKLE_COLORS = ['#ff5d73', '#ffd23f', '#4ecdc4', '#7c6ff0', '#ff9f1c', '#4caf50'];
const sprinkleRgb = SPRINKLE_COLORS.map(hexToRgb);
for (let i = 0; i < 1600; i++) {
  const layer = LAYERS[(Math.random() * LAYERS.length) | 0];
  const a = Math.random() * Math.PI * 2;
  const onSide = Math.random() < 0.55;
  let x, y, z;
  if (onSide) {
    const r = layer.radius + 0.015;
    y = layer.cy - layer.height / 2 + Math.random() * layer.height;
    x = Math.cos(a) * r;
    z = Math.sin(a) * r;
  } else {
    const r = layer.radius * Math.sqrt(Math.random());
    y = layer.cy + layer.height / 2;
    x = Math.cos(a) * r;
    z = Math.sin(a) * r;
  }
  toppingPositions.push(x, y, z);
  const c = sprinkleRgb[(Math.random() * sprinkleRgb.length) | 0];
  toppingColors.push(c[0] / 255, c[1] / 255, c[2] / 255);
}

// 白色奶油从顶层顶部边缘流下（奶滴效果）
const creamTopLayer = LAYERS[LAYERS.length - 1];
const creamTopY = creamTopLayer.cy + creamTopLayer.height / 2;
const creamBaseR = creamTopLayer.radius + 0.03;
const dripCount = 70; // 奶滴数量
for (let s = 0; s < dripCount; s++) {
  const a = Math.random() * Math.PI * 2;
  const L = 0.15 + Math.random() * Math.random() * 0.55; // 奶滴长度，短的居多
  const rr = creamBaseR + Math.random() * 0.05;
  const steps = Math.max(5, Math.floor(L * 18));
  for (let k = 0; k <= steps; k++) {
    const t = k / steps; // 0 顶部，1 底部
    const y = creamTopY - L * t;
    const narrow = 1 - t; // 越往下越细
    const r = rr + (Math.random() - 0.5) * 0.025 * (0.4 + narrow * 0.6);
    toppingPositions.push(Math.cos(a) * r, y, Math.sin(a) * r);
    const w = 0.96 + Math.random() * 0.04;
    toppingColors.push(w, w * 0.98, w * 0.94);
  }
}

const toppingGeometry = new THREE.BufferGeometry();
toppingGeometry.setAttribute('position', new THREE.Float32BufferAttribute(toppingPositions, 3));
toppingGeometry.setAttribute('color', new THREE.Float32BufferAttribute(toppingColors, 3));

const toppingMaterial = new THREE.PointsMaterial({
  size: 0.09,
  map: makeCircleTexture(),
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  sizeAttenuation: true,
});
const topping = new THREE.Points(toppingGeometry, toppingMaterial);
topping.renderOrder = 1; // 确保糖霜/糖粒画在实心蛋糕之上
scene.add(topping);

/* ============================= 蜡烛 + 火焰 ============================= */
const candleGroup = new THREE.Group();
scene.add(candleGroup);

const CANDLE_COLORS = ['#ff5d73', '#ffd23f', '#4ecdc4', '#7c6ff0', '#ff9f1c', '#ff6fb0', '#6ee7b7', '#f472b6', '#60a5fa'];
const candles = [];
const flameTexture = makeFlameTexture();

for (let i = 0; i < 9; i++) {
  const a = (i / 9) * Math.PI * 2 - Math.PI / 2;
  const x = Math.cos(a) * 0.7;
  const z = Math.sin(a) * 0.7;

  const g = new THREE.Group();
  g.position.set(x, TOP_Y, z);

  // 蜡烛身体
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, 0.42, 24),
    new THREE.MeshStandardMaterial({ color: CANDLE_COLORS[i], roughness: 0.45 })
  );
  body.position.y = 0.21;
  g.add(body);

  // 灯芯
  const wick = new THREE.Mesh(
    new THREE.CylinderGeometry(0.008, 0.008, 0.08, 8),
    new THREE.MeshStandardMaterial({ color: 0x2a1a12, roughness: 0.8 })
  );
  wick.position.y = 0.46;
  g.add(wick);

  // 火焰（发光精灵）
  const flame = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: flameTexture,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
    })
  );
  flame.position.y = 0.56;
  flame.scale.set(0.45, 0.72, 1);
  g.add(flame);

  candleGroup.add(g);
  candles.push({ group: g, flame, phase: i * 2.1 });
}

/* ============================= 背景星空 ============================= */
const starPositions = [];
for (let i = 0; i < 400; i++) {
  const a = Math.random() * Math.PI * 2;
  const e = Math.acos(2 * Math.random() - 1);
  const r = 18 + Math.random() * 14;
  starPositions.push(
    r * Math.sin(e) * Math.cos(a),
    r * Math.sin(e) * Math.sin(a),
    r * Math.cos(e)
  );
}
const stars = new THREE.Points(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3)),
  new THREE.PointsMaterial({
    color: 0xffffff, size: 2.4, sizeAttenuation: false, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  })
);
scene.add(stars);

/* ============================= 金色星尘（漂浮，逐颗闪烁） ============================= */
const SPARKLE_COUNT = 260;
const sparklePositions = new Float32Array(SPARKLE_COUNT * 3);
const sparklePhase = new Float32Array(SPARKLE_COUNT);
const sparkleSize = new Float32Array(SPARKLE_COUNT);
for (let i = 0; i < SPARKLE_COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 2.6 + Math.random() * 2.6;
  sparklePositions[i * 3] = Math.cos(a) * r;
  sparklePositions[i * 3 + 1] = Math.random() * 4.2;
  sparklePositions[i * 3 + 2] = Math.sin(a) * r;
  sparklePhase[i] = Math.random() * Math.PI * 2;
  sparkleSize[i] = 0.6 + Math.random() * 1.6;
}
const sparkleGeom = new THREE.BufferGeometry();
sparkleGeom.setAttribute('position', new THREE.BufferAttribute(sparklePositions, 3));
sparkleGeom.setAttribute('aPhase', new THREE.BufferAttribute(sparklePhase, 1));
sparkleGeom.setAttribute('aSize', new THREE.BufferAttribute(sparkleSize, 1));

const sparkleMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0xffd98a) },
  },
  vertexShader: `
    attribute float aPhase;
    attribute float aSize;
    varying float vPhase;
    void main() {
      vPhase = aPhase;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (28.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform float uTime;
    varying float vPhase;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      if (d > 0.5) discard;
      float core = smoothstep(0.5, 0.0, d);
      core *= core;
      float tw = 0.5 + 0.5 * sin(uTime * 2.6 + vPhase);
      tw *= tw; // 接近“亮/灭”的闪烁
      gl_FragColor = vec4(uColor, core * tw);
    }
  `,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
});
const sparkles = new THREE.Points(sparkleGeom, sparkleMat);
scene.add(sparkles);
sparkles.renderOrder = 2;

/* ============================= 彩纸粒子（吹蜡烛时喷发） ============================= */
const CONFETTI_COUNT = 600;
const confettiPos = new Float32Array(CONFETTI_COUNT * 3).fill(-9999);
const confettiCol = new Float32Array(CONFETTI_COUNT * 3).fill(1);
const confettiVel = new Float32Array(CONFETTI_COUNT * 3);
const confettiLife = new Float32Array(CONFETTI_COUNT);

const confetti = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({
    size: 0.13, map: makeCircleTexture(), vertexColors: true,
    transparent: true, depthWrite: false, sizeAttenuation: true,
  })
);
confetti.geometry.setAttribute('position', new THREE.Float32BufferAttribute(confettiPos, 3));
confetti.geometry.setAttribute('color', new THREE.Float32BufferAttribute(confettiCol, 3));
scene.add(confetti);
confetti.renderOrder = 3;

function spawnConfetti() {
  const pos = confetti.geometry.attributes.position.array;
  const col = confetti.geometry.attributes.color.array;
  for (let i = 0; i < CONFETTI_COUNT; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.1 + Math.random() * 0.5;
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = TOP_Y + 0.3 + Math.random() * 0.4;
    pos[i * 3 + 2] = Math.sin(a) * r;

    const speed = 2.2 + Math.random() * 4.5;
    const va = Math.random() * Math.PI * 2;
    const vv = Math.random() * Math.PI * 0.9;
    confettiVel[i * 3] = Math.cos(va) * Math.cos(vv) * speed;
    confettiVel[i * 3 + 1] = Math.abs(Math.sin(vv)) * speed + 1.8;
    confettiVel[i * 3 + 2] = Math.sin(va) * Math.cos(vv) * speed;
    confettiLife[i] = 1.6 + Math.random() * 1.5;

    const c = sprinkleRgb[(Math.random() * sprinkleRgb.length) | 0];
    col[i * 3] = c[0] / 255;
    col[i * 3 + 1] = c[1] / 255;
    col[i * 3 + 2] = c[2] / 255;
  }
  confetti.geometry.attributes.position.needsUpdate = true;
  confetti.geometry.attributes.color.needsUpdate = true;
}

function updateConfetti(dt) {
  const pos = confetti.geometry.attributes.position.array;
  let alive = false;
  for (let i = 0; i < CONFETTI_COUNT; i++) {
    if (confettiLife[i] <= 0) continue;
    alive = true;
    confettiLife[i] -= dt;
    confettiVel[i * 3 + 1] -= 7.5 * dt; // 重力
    pos[i * 3] += confettiVel[i * 3] * dt;
    pos[i * 3 + 1] += confettiVel[i * 3 + 1] * dt;
    pos[i * 3 + 2] += confettiVel[i * 3 + 2] * dt;
    if (pos[i * 3 + 1] < 0.06) { // 落地回弹
      pos[i * 3 + 1] = 0.06;
      confettiVel[i * 3 + 1] *= -0.3;
      confettiVel[i * 3] *= 0.8;
      confettiVel[i * 3 + 2] *= 0.8;
    }
    if (confettiLife[i] <= 0) pos[i * 3 + 1] = -9999;
  }
  if (alive) confetti.geometry.attributes.position.needsUpdate = true;
}

/* ============================= 交互：吹蜡烛 ============================= */
let candlesLit = true;
const blowBtn = document.getElementById('blowBtn');
const toast = document.getElementById('toast');
let toastTimer = null;

function showToast() {
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

blowBtn.addEventListener('click', () => {
  candlesLit = !candlesLit;
  for (const c of candles) c.flame.visible = candlesLit;
  if (!candlesLit) {
    spawnConfetti();
    blowBtn.textContent = '重新点燃蜡烛';
    showToast();
  } else {
    blowBtn.textContent = '吹蜡烛';
  }
});

/* ============================= 动画循环 ============================= */
const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  // 蜡烛火焰闪烁
  for (let i = 0; i < candles.length; i++) {
    const c = candles[i];
    if (!c.flame.visible) continue;
    const s = 1 + Math.sin(t * 24 + c.phase) * 0.08 + Math.sin(t * 61 + c.phase * 3) * 0.05;
    c.flame.scale.set(0.45 * s, 0.72 * s, 1);
    c.flame.position.y = 0.56 + Math.sin(t * 22 + c.phase) * 0.012;
  }
  candleGlow.intensity = candlesLit ? 1.4 + Math.sin(t * 18) * 0.25 : 0.0;

  // 漂浮星尘缓慢旋转 + 逐颗闪烁；背景星星微微闪动
  sparkles.rotation.y = t * 0.06;
  sparkleMat.uniforms.uTime.value = t;
  stars.rotation.y = -t * 0.008;
  stars.material.opacity = 0.6 + 0.2 * Math.sin(t * 1.3) + 0.12 * Math.sin(t * 4.7);

  updateConfetti(dt);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
window.__cakeReady = true;

/* ============================= 自适应窗口 ============================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 开场先放一轮彩纸庆祝
setTimeout(spawnConfetti, 800);
</script>

  setTimeout(function () {
    if (!window.__cakeReady) {
      document.getElementById('loadError').style.display = 'flex';
    }
  }, 6000);
